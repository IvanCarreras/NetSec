# ============================================================
#  HOMELAB PHASE 1 — Red base + Web targets + Reverse Proxy
#  Redes: DMZ | INTERNAL | MGMT
#
#  Acceso externo (desde Windows / red local):
#    DVWA       → http(s)://<IP_UBUNTU>
#    Juice Shop → http(s)://<IP_UBUNTU>:8443
#    Portainer  → http://<IP_UBUNTU>:9000
# ============================================================

version: '3.8'

# ─────────────────────────────────────────────
#  NETWORKS
# ─────────────────────────────────────────────
networks:

  # Zona pública — targets web + reverse proxy
  # El proxy es el único nodo con puerto expuesto al host
  dmz_net:
    name: dmz_net
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1

  # Zona privada — SIEM (vacía en fase 1, preparada para fase 2)
  internal_net:
    name: internal_net
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 10.10.20.0/24
          gateway: 10.10.20.1

  # Zona de gestión — Portainer
  mgmt_net:
    name: mgmt_net
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 10.10.30.0/24
          gateway: 10.10.30.1

# ─────────────────────────────────────────────
#  VOLUMES
# ─────────────────────────────────────────────
volumes:
  nginx_logs:
  dvwa_db_data:
  portainer_data:

# ─────────────────────────────────────────────
#  SERVICES
# ─────────────────────────────────────────────
services:

  # ══════════════════════════════════════════
  #  REVERSE PROXY — Nginx
  #  Único punto de entrada a la DMZ.
  #  Escucha en 0.0.0.0 → accesible desde
  #  Windows y cualquier equipo de la red local.
  #
  #  :80   → redirige a HTTPS
  #  :443  → DVWA
  #  :8443 → Juice Shop
  # ══════════════════════════════════════════
  nginx-rp:
    image: nginx:1.25-alpine
    container_name: nginx-rp
    hostname: nginx-rp
    networks:
      dmz_net:
        ipv4_address: 10.10.10.10
    ports:
      - "0.0.0.0:80:80"       # HTTP  — red local completa
      - "0.0.0.0:443:443"     # HTTPS — DVWA
      - "0.0.0.0:8443:8443"   # HTTPS — Juice Shop
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      dvwa:
        condition: service_healthy
      juiceshop:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "homelab.zone=dmz"
      - "homelab.role=reverse-proxy"

  # ══════════════════════════════════════════
  #  DVWA — Damn Vulnerable Web Application
  #  Target clásico: SQLi, XSS, CSRF, Upload
  #  Acceso: https://<IP_UBUNTU>
  #  Sin puerto expuesto al host — solo via proxy
  # ══════════════════════════════════════════
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: dvwa
    hostname: dvwa
    networks:
      dmz_net:
        ipv4_address: 10.10.10.20
    environment:
      DB_SERVER: dvwa-db
      DB_PORT: "3306"
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: dvwa_s3cur3
      RECAPTCHA_PRIV_KEY: ""
      RECAPTCHA_PUB_KEY: ""
    depends_on:
      dvwa-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "homelab.zone=dmz"
      - "homelab.role=target"
      - "homelab.app=dvwa"

  # ──────────────────────────────────────────
  #  DVWA — Base de datos MySQL
  #  Aislada en DMZ, sin ningún puerto expuesto
  # ──────────────────────────────────────────
  dvwa-db:
    image: mysql:8.0
    container_name: dvwa-db
    hostname: dvwa-db
    networks:
      dmz_net:
        ipv4_address: 10.10.10.21
    environment:
      MYSQL_ROOT_PASSWORD: root_s3cur3_2024
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: dvwa_s3cur3
    volumes:
      - dvwa_db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_s3cur3_2024"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "homelab.zone=dmz"
      - "homelab.role=database"
      - "homelab.app=dvwa-db"

  # ══════════════════════════════════════════
  #  JUICE SHOP — OWASP Juice Shop
  #  Target moderno: API REST, JWT, IDOR, XSS
  #  Acceso: https://<IP_UBUNTU>:8443
  #  Sin puerto expuesto al host — solo via proxy
  # ══════════════════════════════════════════
  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: juiceshop
    hostname: juiceshop
    networks:
      dmz_net:
        ipv4_address: 10.10.10.30
    environment:
      - NODE_ENV=unsafe
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "homelab.zone=dmz"
      - "homelab.role=target"
      - "homelab.app=juiceshop"

  # ══════════════════════════════════════════
  #  PORTAINER — Gestión Docker via GUI
  #  Acceso: http://<IP_UBUNTU>:9000
  #  Expuesto directamente (gestión admin)
  # ══════════════════════════════════════════
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    hostname: portainer
    networks:
      mgmt_net:
        ipv4_address: 10.10.30.10
    ports:
      - "0.0.0.0:9000:9000"   # Accesible desde red local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    restart: unless-stopped
    labels:
      - "homelab.zone=mgmt"
      - "homelab.role=management"
