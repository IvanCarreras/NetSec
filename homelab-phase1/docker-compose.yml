# ============================================================
#  HOMELAB PHASE 1 — Red base + Web targets + Reverse Proxy
#  Redes: WAN | DMZ | INTERNAL | MGMT
# ============================================================

version: '3.8'

# ─────────────────────────────────────────────
#  NETWORKS
# ─────────────────────────────────────────────
networks:

  # Simula internet — zona del atacante
  wan_net:
    name: wan_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1

  # Zona pública — targets web + reverse proxy
  dmz_net:
    name: dmz_net
    driver: bridge
    internal: true          # sin acceso directo al host
    ipam:
      driver: default
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1

  # Zona privada — SIEM (vacía en fase 1, preparada)
  internal_net:
    name: internal_net
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 10.10.20.0/24
          gateway: 10.10.20.1

  # Zona de gestión — Portainer
  mgmt_net:
    name: mgmt_net
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 10.10.30.0/24
          gateway: 10.10.30.1

# ─────────────────────────────────────────────
#  VOLUMES
# ─────────────────────────────────────────────
volumes:
  nginx_logs:
  dvwa_db_data:
  portainer_data:

# ─────────────────────────────────────────────
#  SERVICES
# ─────────────────────────────────────────────
services:

  # ══════════════════════════════════════════
  #  REVERSE PROXY — Nginx
  #  Único punto de entrada desde WAN → DMZ
  #  IP WAN  : 192.168.100.10
  #  IP DMZ  : 10.10.10.10
  # ══════════════════════════════════════════
  nginx-rp:
    image: nginx:1.25-alpine
    container_name: nginx-rp
    hostname: nginx-rp
    networks:
      wan_net:
        ipv4_address: 192.168.100.10
      dmz_net:
        ipv4_address: 10.10.10.10
    ports:
      - "80:80"           # HTTP — accesible desde el host
      - "443:443"         # HTTPS — accesible desde el host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      dvwa:
        condition: service_healthy
      juiceshop:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "homelab.zone=dmz"
      - "homelab.role=reverse-proxy"

  # ══════════════════════════════════════════
  #  DVWA — Damn Vulnerable Web Application
  #  Target clásico: SQLi, XSS, CSRF, Upload
  #  IP DMZ: 10.10.10.20
  # ══════════════════════════════════════════
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: dvwa
    hostname: dvwa
    networks:
      dmz_net:
        ipv4_address: 10.10.10.20
    environment:
      DB_SERVER: dvwa-db
      DB_PORT: "3306"
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: dvwa_s3cur3
      RECAPTCHA_PRIV_KEY: ""
      RECAPTCHA_PUB_KEY: ""
    depends_on:
      dvwa-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "homelab.zone=dmz"
      - "homelab.role=target"
      - "homelab.app=dvwa"

  # ──────────────────────────────────────────
  #  DVWA — Base de datos MySQL
  #  Solo accesible desde DMZ (no expuesta)
  #  IP DMZ: 10.10.10.21
  # ──────────────────────────────────────────
  dvwa-db:
    image: mysql:8.0
    container_name: dvwa-db
    hostname: dvwa-db
    networks:
      dmz_net:
        ipv4_address: 10.10.10.21
    environment:
      MYSQL_ROOT_PASSWORD: root_s3cur3_2024
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: dvwa_s3cur3
    volumes:
      - dvwa_db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_s3cur3_2024"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "homelab.zone=dmz"
      - "homelab.role=database"
      - "homelab.app=dvwa-db"

  # ══════════════════════════════════════════
  #  JUICE SHOP — OWASP Juice Shop
  #  Target moderno: API REST, JWT, IDOR, XSS
  #  IP DMZ: 10.10.10.30
  # ══════════════════════════════════════════
  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: juiceshop
    hostname: juiceshop
    networks:
      dmz_net:
        ipv4_address: 10.10.10.30
    environment:
      - NODE_ENV=unsafe
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "homelab.zone=dmz"
      - "homelab.role=target"
      - "homelab.app=juiceshop"

  # ══════════════════════════════════════════
  #  KALI LINUX — Máquina atacante
  #  Solo tiene acceso a WAN_NET
  #  IP WAN: 192.168.100.20
  # ══════════════════════════════════════════
  kali:
    image: kalilinux/kali-rolling:latest
    container_name: kali-attacker
    hostname: kali-attacker
    networks:
      wan_net:
        ipv4_address: 192.168.100.20
    stdin_open: true
    tty: true
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y -qq
          nmap curl wget nikto sqlmap
          hydra gobuster wfuzz
          net-tools iputils-ping dnsutils
          python3 python3-pip 2>/dev/null;
        echo '[*] Kali listo. Conecta con: docker exec -it kali-attacker bash';
        tail -f /dev/null
      "
    restart: unless-stopped
    labels:
      - "homelab.zone=wan"
      - "homelab.role=attacker"

  # ══════════════════════════════════════════
  #  PORTAINER — Gestión Docker via GUI
  #  Solo accesible desde MGMT_NET
  #  IP MGMT: 10.10.30.10  |  Host: :9000
  # ══════════════════════════════════════════
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    hostname: portainer
    networks:
      mgmt_net:
        ipv4_address: 10.10.30.10
    ports:
      - "9000:9000"       # Solo para acceso desde el host (admin)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    restart: unless-stopped
    labels:
      - "homelab.zone=mgmt"
      - "homelab.role=management"
