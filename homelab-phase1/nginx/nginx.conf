# ============================================================
#  nginx.conf — Configuración principal del Reverse Proxy
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ──────────────────────────────────────────
    #  FORMATO DE LOGS (JSON estructurado para Filebeat → Elastic)
    #  En Fase 2 Filebeat leerá este formato directamente
    # ──────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_response_time":"$upstream_response_time",'
            '"request_time":"$request_time"'
        '}';

    access_log  /var/log/nginx/access.log  json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ──────────────────────────────────────────
    #  SEGURIDAD — Headers globales
    # ──────────────────────────────────────────
    server_tokens  off;                        # Oculta versión de Nginx
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # ──────────────────────────────────────────
    #  RATE LIMITING — Detección de brute force
    #  Suricata lo verá a nivel red; esto lo ve Nginx
    # ──────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;

    # ──────────────────────────────────────────
    #  VIRTUAL HOSTS
    # ──────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
