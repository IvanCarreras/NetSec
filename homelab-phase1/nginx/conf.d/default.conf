# ============================================================
#  conf.d/default.conf — Virtual Hosts del homelab
#  DVWA      → http(s)://dvwa.homelab.local
#  JuiceShop → http(s)://juice.homelab.local
# ============================================================


# ──────────────────────────────────────────────────────────
#  REDIRECT HTTP → HTTPS (todo el tráfico HTTP se eleva)
# ──────────────────────────────────────────────────────────
server {
    listen       80 default_server;
    server_name  _;

    # Log de todos los intentos HTTP (útil para detectar scanners)
    access_log   /var/log/nginx/http_redirect.log  json_combined;

    return 301 https://$host$request_uri;
}


# ──────────────────────────────────────────────────────────
#  DVWA — Damn Vulnerable Web Application
#  Target: http://localhost  (redirige a https)
#          https://dvwa.homelab.local  ó  https://localhost
# ──────────────────────────────────────────────────────────
server {
    listen       443 ssl;
    server_name  dvwa.homelab.local localhost;

    # Certificado self-signed (generado por setup.sh)
    ssl_certificate     /etc/nginx/ssl/homelab.crt;
    ssl_certificate_key /etc/nginx/ssl/homelab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Logs separados por aplicación
    access_log  /var/log/nginx/dvwa_access.log  json_combined;
    error_log   /var/log/nginx/dvwa_error.log   warn;

    # Rate limiting global + específico en login
    limit_req zone=global burst=50 nodelay;

    location /login.php {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://10.10.10.20;
    }

    location / {
        proxy_pass         http://10.10.10.20;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts generosos — DVWA puede ser lento al arrancar
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
    }
}


# ──────────────────────────────────────────────────────────
#  JUICE SHOP — OWASP Juice Shop
#  Target: https://juice.homelab.local  ó  https://localhost:8443
# ──────────────────────────────────────────────────────────
server {
    listen       8443 ssl;
    server_name  juice.homelab.local;

    ssl_certificate     /etc/nginx/ssl/homelab.crt;
    ssl_certificate_key /etc/nginx/ssl/homelab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log  /var/log/nginx/juice_access.log  json_combined;
    error_log   /var/log/nginx/juice_error.log   warn;

    limit_req zone=global burst=80 nodelay;

    location / {
        proxy_pass         http://10.10.10.30:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Juice Shop usa WebSockets para el score board
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";

        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
    }
}
