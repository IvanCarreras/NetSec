# ============================================================
#  conf.d/default.conf — Virtual Hosts del homelab
#
#  :80        → redirect HTTP → HTTPS
#  :443       → DVWA
#  :8443      → Juice Shop
# ============================================================


# ──────────────────────────────────────────────────────────
#  REDIRECT HTTP → HTTPS
# ──────────────────────────────────────────────────────────
server {
    listen      80 default_server;
    server_name _;

    access_log  /var/log/nginx/http_redirect.log  json_combined;

    return 301 https://$host$request_uri;
}


# ──────────────────────────────────────────────────────────
#  DVWA — puerto 443
#  Acceso: https://<IP_UBUNTU_SERVER>
# ──────────────────────────────────────────────────────────
server {
    listen      443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/homelab.crt;
    ssl_certificate_key /etc/nginx/ssl/homelab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log  /var/log/nginx/dvwa_access.log  json_combined;
    error_log   /var/log/nginx/dvwa_error.log   warn;

    # Rate limiting global
    limit_req zone=global burst=50 nodelay;

    # Rate limiting estricto en login — detecta brute force
    location /login.php {
        limit_req zone=login burst=3 nodelay;
        proxy_pass         http://10.10.10.20;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://10.10.10.20;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
    }
}


# ──────────────────────────────────────────────────────────
#  JUICE SHOP — puerto 8443
#  Acceso: https://<IP_UBUNTU_SERVER>:8443
# ──────────────────────────────────────────────────────────
server {
    listen      8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/homelab.crt;
    ssl_certificate_key /etc/nginx/ssl/homelab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log  /var/log/nginx/juice_access.log  json_combined;
    error_log   /var/log/nginx/juice_error.log   warn;

    limit_req zone=global burst=80 nodelay;

    location / {
        proxy_pass         http://10.10.10.30:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSockets para el scoreboard de Juice Shop
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";

        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
    }
}
