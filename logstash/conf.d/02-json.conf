# logstash/conf.d/02-json.conf
# Pipeline para procesar JSON estructurado (Suricata EVE, custom events)

input {
  # HTTP input para enviar JSON directamente
  http {
    host => "0.0.0.0"
    port => 8080
    codec => json
    add_field => { "input_type" => "http_json" }
  }

  # TCP input para JSON línea a línea (Suricata EVE, etc.)
  tcp {
    host => "0.0.0.0"
    port => 5044
    codec => json
    add_field => { "input_type" => "tcp_json" }
  }
}

filter {
  # Detección automática de Suricata EVE
  if [event_type] {
    mutate {
      add_tag => [ "suricata", "ids" ]
      add_field => { "log_source" => "suricata" }
    }

    # Enriquecer con contexto de Suricata
    if [event_type] == "alert" {
      mutate {
        add_tag => [ "security_alert" ]
        add_field => { "severity" => "high" }
      }
    }

    if [event_type] == "flow" {
      mutate {
        add_tag => [ "network_flow" ]
      }
    }

    if [event_type] == "http" {
      mutate {
        add_tag => [ "http_request" ]
      }
    }

    if [event_type] == "dns" {
      mutate {
        add_tag => [ "dns_query" ]
      }
    }

    if [event_type] == "tls" {
      mutate {
        add_tag => [ "tls_cert" ]
      }
    }
  }

  # Para eventos JSON genéricos sin structure
  if ![log_source] and [input_type] {
    mutate {
      add_field => { "log_source" => "generic_json" }
    }
  }

  # Agregar timestamp si no existe
  if ![timestamp] {
    mutate {
      add_field => { "[@metadata][timestamp]" => "%{+YYYY.MM.dd}" }
    }
  }

  # Conversión de tipos si es necesario
  if [src_port] {
    mutate {
      convert => { "src_port" => "integer" }
      convert => { "dest_port" => "integer" }
    }
  }
}

output {
  # Índice de Suricata
  if [log_source] == "suricata" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "suricata-%{event_type}-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # Índice genérico para otro JSON
  if [log_source] == "generic_json" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "events-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # Fallback
  if ![log_source] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "unknown-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # Debug (descomentar para troubleshooting)
  # stdout {
  #   codec => json
  # }
}