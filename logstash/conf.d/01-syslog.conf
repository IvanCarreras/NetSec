# logstash/conf.d/01-syslog.conf
# Pipeline para procesar syslog (Sysmon, Auditd, etc.)

input {
  # Recibir syslog por TCP/UDP
  syslog {
    host => "0.0.0.0"
    port => 5000
    codec => "line"
  }
}

filter {
  # Agregar timestamp
  if ![timestamp] {
    mutate {
      add_field => { "[@metadata][timestamp]" => "%{+YYYY.MM.dd}" }
    }
  }

  # Parse de Sysmon (si viene etiquetado)
  if [message] =~ /Sysmon/ or [program] =~ /Sysmon/ {
    grok {
      match => { "message" => "%{SYSLOGBASE:syslog_host} %{DATA:sysmon_event}:\s*(?<sysmon_data>.*)" }
      add_tag => [ "sysmon", "windows" ]
    }
    mutate {
      add_field => { "log_source" => "sysmon" }
      add_field => { "os" => "windows" }
    }
  }

  # Parse de Auditd (Linux)
  if [message] =~ /audit/ {
    grok {
      match => { "message" => "%{SYSLOGBASE:syslog_host}\s*%{DATA:audit_data}" }
      add_tag => [ "auditd", "linux" ]
    }
    mutate {
      add_field => { "log_source" => "auditd" }
      add_field => { "os" => "linux" }
    }
  }

  # Parse genérico de syslog
  if ![log_source] {
    grok {
      match => { "message" => "%{SYSLOGBASE} %{GREEDYDATA:message}" }
      add_field => { "log_source" => "syslog" }
    }
  }

  # Limpiar campos metadata de syslog
  mutate {
    remove_field => [ "priority", "severity", "facility", "facility_label", "severity_label" ]
  }
}

output {
  # Enviar a Elasticsearch con índices por día y origen
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "syslog-%{log_source}-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Debug: Ver en logs (comentar en producción)
  # stdout {
  #   codec => rubydebug
  # }
}